# Keeps the pinned actions and the dev dependencies current, grouped into
# one pull request per ecosystem a month.
version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
      groups:
          actions:
              patterns: ["*"]
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: monthly
      groups:
          npm:
              patterns: ["*"]
