name: Release Obsidian plugin

on:
    push:
        # Numeric release tags only. The version check below also refuses a
        # tag that isn't the manifest's version, such as the plugin
        # template's old 1.0.x ones.
        tags:
            - "[0-9]+.[0-9]+.[0-9]+"

jobs:
    # Nothing is released that doesn't pass CI.
    ci:
        uses: ./.github/workflows/ci.yml
        permissions:
            contents: read

    build:
        needs: ci
        runs-on: ubuntu-latest
        permissions:
            contents: write
            # Required to attest that these assets were built here, from this
            # source, rather than uploaded by hand.
            id-token: write
            attestations: write
        steps:
            # Pinned to commits, with the tag each was beside.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # The build runs third-party install scripts; they don't
                  # need a token left in .git/config. The release step
                  # authenticates through GITHUB_TOKEN instead.
                  persist-credentials: false

            - name: Check the tag matches the version
              run: |
                  v=$(node -p 'require("./manifest.json").version')
                  test "$GITHUB_REF_NAME" = "$v" || { echo "tag $GITHUB_REF_NAME, manifest.json $v"; exit 1; }
                  test "$(node -p 'require("./package.json").version')" = "$v" || { echo "package.json disagrees with $v"; exit 1; }
                  node -e 'process.exit(require("./versions.json")[process.argv[1]] ? 0 : 1)' "$v" || { echo "versions.json has no $v"; exit 1; }

            - name: Use Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Build plugin
              # `npm ci` installs exactly what the lockfile pins; `npm install`
              # is free to resolve caret ranges to newer versions, which makes
              # the released bundle unreproducible.
              run: |
                  npm ci
                  npm run build

            - name: Attest build provenance
              uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      styles.css

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  gh release create "$tag" \
                    --title="$tag" \
                    --draft \
                    main.js manifest.json styles.css
