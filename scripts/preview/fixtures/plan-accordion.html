<!--
  A plan page's foldable section headers.

  What to look at: the space above and below the label should match, closed
  and open alike — open, the body's last row should end as far from the next
  divider as the heading sits from the one above it. The count badge stands
  in for the contents while a section is folded and disappears once it opens —
  including a zero, which is an answer in itself.
  The chevron owns the right edge. Nothing else lives in
  these headers — "Copy as text" moved into the timeline's own button row,
  where it no longer competes with the chevron for the same corner.

  The wrapper below stands in for .contact-content-stacked so the sections
  get their dividers and margins exactly as they do on the page.
-->
<div class="contact-content contact-content-stacked">
	<div class="contact-stack-section plan-accordion">
		<div class="contact-stack-header plan-accordion-header">
			<span class="contact-stack-header-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg></span>
			<span>Ideas</span>
			<span class="dashboard-count-badge plan-accordion-count">4</span>
			<span class="plan-accordion-chevron"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
		</div>
		<div class="plan-accordion-body"><div style="padding:0 16px 12px">Closed — this body is hidden.</div></div>
	</div>

	<div class="contact-stack-section plan-accordion">
		<div class="contact-stack-header plan-accordion-header">
			<span class="contact-stack-header-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg></span>
			<span>Timeline</span>
			<span class="dashboard-count-badge plan-accordion-count">12</span>
			<span class="plan-accordion-chevron"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
		</div>
		<div class="plan-accordion-body"><div style="padding:0 16px 12px">Closed.</div></div>
	</div>

	<div class="contact-stack-section plan-accordion is-open">
		<div class="contact-stack-header plan-accordion-header">
			<span class="contact-stack-header-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg></span>
			<span>Timeline</span>
			<span class="dashboard-count-badge plan-accordion-count">12</span>
			<span class="plan-accordion-chevron"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
		</div>
		<div class="plan-accordion-body">
			<div class="contact-ideas-section plan-items-section">
				<!-- The two adds run together; Copy as text acts on the whole
				     timeline, so it takes the far edge. -->
				<div class="contact-section-footer plan-timeline-footer plan-timeline-footer-top">
					<button class="callander-button">+ Add to timeline</button>
					<button class="callander-button">+ Add travel</button>
					<button class="callander-button plan-timeline-copy">Copy as text</button>
				</div>
				<div style="padding:8px 16px 12px">Open — body content sets the space beneath the header.</div>
			</div>
		</div>
	</div>

	<div class="contact-stack-section plan-accordion">
		<div class="contact-stack-header plan-accordion-header">
			<span class="contact-stack-header-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9V6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v3"/><path d="M2 11v5a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5"/></svg></span>
			<span>Cost breakdown</span>
			<span class="dashboard-count-badge plan-accordion-count">0</span>
			<span class="plan-accordion-chevron"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
		</div>
		<div class="plan-accordion-body"><div style="padding:0 16px 12px">Closed.</div></div>
	</div>
</div>
