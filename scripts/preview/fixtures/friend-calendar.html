<!--
  The All friends B'day Calendar, month view.

  Reuses the Events calendar's grid, chips and narrow behaviour, so the two
  read as the same object with different contents. Worth its own fixture for
  the parts that differ: a chip stacks, so the name gets a line to itself,
  and a birthday known only to its month is named under the grid, because it
  belongs to the month and to no square in it. Rows here carry no Glance
  button — clicking anywhere in the calendar glances, so a second control
  saying so would read as a different action.
-->

		<span class="cal-period">September 2026</span>

			<button class="callander-button cal-nav-button">&lsaquo;</button>

		</div>
	</div>
	<div class="cal-weekdays"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
	<div class="cal-grid">
