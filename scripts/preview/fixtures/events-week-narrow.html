<!--
  The Events calendar's Week tab at phone width.

  Seven narrow columns are unreadable, so a narrow week stacks into day
  sections — which means each chip has the whole width rather than a
  seventh of it. That's the one narrow calendar view that can be read
  rather than scanned, so the type sizes up and the names stop truncating.

  Worth checking: a long name wraps instead of ellipsing, the two chip
  lines stay distinct, and the day heading reads as the heading rather than
  as a caption on the chips beneath it.
-->
<div class="cal" style="max-width:327px">
	<div class="cal-week">
		<div class="cal-cell is-today">
			<div class="cal-cell-head"><span class="cal-daynum">17</span><span class="cal-dow">Thu</span></div>
			<div class="cal-chip is-stacked" style="--cal-chip:#d95757">
				<div class="cal-chip-name">Folk night at Club Passim</div>
				<div class="cal-chip-meta">🎸 8pm</div>
			</div>
			<div class="cal-chip is-stacked" style="--cal-chip:#e0559a">
				<div class="cal-chip-name">Dinner at Neptune Oyster with everyone</div>
				<div class="cal-chip-meta">🎉 7:30pm</div>
			</div>
		</div>
		<div class="cal-cell">
			<div class="cal-cell-head"><span class="cal-daynum">18</span><span class="cal-dow">Fri</span></div>
			<div class="cal-chip is-stacked" style="--cal-chip:#7aa64a">
				<div class="cal-chip-name">Franconia Ridge loop</div>
				<div class="cal-chip-meta">🥾 9am</div>
			</div>
		</div>
		<div class="cal-cell">
			<div class="cal-cell-head"><span class="cal-daynum">19</span><span class="cal-dow">Sat</span></div>
		</div>
	</div>
</div>
