<!--
  The dashboard's Upcoming section.

  Grouped rather than a flat list, and the headings are muted where the
  Events page accents them: this is one section among many on a dense page,
  so a column of purple would compete with the section headings themselves.

  All three groups the section can produce are here. It reaches no further
  than next week, so the month headings the Events page uses never appear.
-->
<div class="dashboard-section dashboard-upcoming-section">
	<div class="dashboard-section-header">
		<h3>📌 Upcoming</h3>
		<div class="dashboard-section-buttons">
			<button class="callander-button">Add event</button>
			<button class="callander-button">See all</button>
		</div>
	</div>

	<div class="dashboard-upcoming-timeline">
		<div class="contact-timeline-year">No exact date</div>
		<div class="dashboard-row dashboard-row-clickable dashboard-upcoming-row">
			<div class="dashboard-upcoming-main">
				<div class="dashboard-upcoming-when">📅 Anytime</div>
				<div class="dashboard-upcoming-name">
					<span>Coffee with Deepa</span
					><span class="dashboard-upcoming-person">
						• Deepa Iyer</span
					>
				</div>
			</div>
		</div>

		<div class="contact-timeline-year">This week</div>
		<div class="dashboard-row dashboard-row-clickable dashboard-upcoming-row">
			<div class="dashboard-upcoming-main">
				<div class="dashboard-upcoming-when">🥾 Wednesday</div>
				<div class="dashboard-upcoming-name">
					<span>Hike at Mount Wilson</span
					><span class="dashboard-upcoming-person">
						• Lauren, Enrique</span
					>
				</div>
			</div>
			<span class="dashboard-upcoming-rel dashboard-rel-soon"
				>in 3 days</span
			>
		</div>
		<div class="dashboard-row dashboard-row-clickable dashboard-upcoming-row">
			<div class="dashboard-upcoming-main">
				<div class="dashboard-upcoming-when">🎸 Friday · 8:00 PM</div>
				<div class="dashboard-upcoming-name">
					<span>Gig at the Corner</span
					><span class="dashboard-upcoming-person">
						• Marcus Webb</span
					>
				</div>
			</div>
			<span class="dashboard-upcoming-rel">in 5 days</span>
		</div>

		<div class="contact-timeline-year">Next week</div>
		<div class="dashboard-row dashboard-row-clickable dashboard-upcoming-row">
			<div class="dashboard-upcoming-main">
				<div class="dashboard-upcoming-when">🎉 Sat 19 Sep</div>
				<div class="dashboard-upcoming-name">
					<span>Priya's housewarming</span
					><span class="dashboard-upcoming-person">
						• Priya Raman</span
					>
				</div>
			</div>
			<span class="dashboard-upcoming-rel">in 13 days</span>
		</div>
	</div>
</div>
